[package]
name = "larm-desktop"
description = "Shell desktop Tauri 2 de LARM"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.99.0"

[lib]
name = "larm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "larm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }
sha2 = "=0.11.0"
serde_json = "=1.0.152"

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "=0.11.0"
hex = "=0.4.3"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"
